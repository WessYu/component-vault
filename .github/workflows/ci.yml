name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPONENT_VAULT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test Component Vault Guard
        run: npm run guard:test
      - name: Enforce component governance
        run: npm run guard:check -- --base "$COMPONENT_VAULT_BASE_REF"
      - name: Generate Guard PR summary
        run: npm run guard:pr -- --base "$COMPONENT_VAULT_BASE_REF"
      - name: Smoke test installable CLI package
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack ./packages/component-vault --silent | tail -n 1)"
          package_path="$GITHUB_WORKSPACE/$tarball"
          test -f "$package_path"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          npm init -y >/dev/null 2>&1
          npm install "$package_path" --silent
          mkdir -p src/components/ui src/pages
          printf '%s\n' 'export const Text = { H1: (props) => <h1 {...props} /> };' > src/components/ui/text.tsx
          git init -q
          git config user.email "guard@example.com"
          git config user.name "Component Vault CI"
          ./node_modules/.bin/component-vault --version
          ./node_modules/.bin/component-vault init
          printf '%s\n' 'export const Page = ({ user }) => <h1 data-user={user?.name}>Título: {user?.name}</h1>;' > src/pages/page.tsx
          if ./node_modules/.bin/component-vault scan; then
            echo "Expected the raw h1 fixture to fail the scan"
            exit 1
          fi
          ./node_modules/.bin/component-vault fix --dry-run
          grep -q '<h1' src/pages/page.tsx
          ./node_modules/.bin/component-vault fix
          grep -q 'import { Text }' src/pages/page.tsx
          grep -q '<Text.H1' src/pages/page.tsx
          node --input-type=module -e 'import("@wess2001/component-vault").then(({ scanProject }) => { const result = scanProject(); if (result.summary.total !== 0) process.exit(1); })'
          git add .
          git commit -qm "initialize smoke fixture"
          ./node_modules/.bin/component-vault doctor
      - name: Build application
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          echo "$code" > build-exit-code
          tail -n 80 build.log
          exit 0
        env:
          NEXT_PUBLIC_CONVEX_URL: https://quixotic-hamster-78.convex.cloud
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload Guard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-vault-guard-report
          path: public/component-vault-report.json
      - name: Upload Guard PR summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-vault-guard-pr-summary
          path: .component-vault/pr-summary.md
      - name: Assert build success
        shell: bash
        run: test "$(cat build-exit-code)" = "0"
