name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build application
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          echo "$code" > build-exit-code
          tail -n 80 build.log
          exit 0
        env:
          NEXT_PUBLIC_CONVEX_URL: https://quixotic-hamster-78.convex.cloud
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Assert build success
        shell: bash
        run: test "$(cat build-exit-code)" = "0"
