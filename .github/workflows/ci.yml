name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPONENT_VAULT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test Component Vault Guard
        run: npm run guard:test
      - name: Enforce component governance
        run: npm run guard:check
      - name: Build application
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          echo "$code" > build-exit-code
          tail -n 80 build.log
          exit 0
        env:
          NEXT_PUBLIC_CONVEX_URL: https://quixotic-hamster-78.convex.cloud
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload Guard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-vault-guard-report
          path: public/component-vault-report.json
      - name: Assert build success
        shell: bash
        run: test "$(cat build-exit-code)" = "0"
