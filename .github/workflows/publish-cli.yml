name: Publish Component Vault CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "component-vault-cli-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@^11.5.1
      - run: npm ci
      - run: npm run guard:test
      - name: Run packaged product proof
        run: npm run demo:proof
      - name: Publish component-vault
        working-directory: packages/component-vault
        run: npm publish --access public
      - name: Verify the published package from the registry
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./packages/component-vault/package.json').name")"
          expected_version="$(node -p "require('./packages/component-vault/package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            published_version="$(npm view "$package_name@$expected_version" version 2>/dev/null || true)"
            if [ "$published_version" = "$expected_version" ]; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo "Registry did not expose $package_name@$expected_version after publication"
              exit 1
            fi
            sleep 5
          done
          install_dir="$(mktemp -d)"
          cd "$install_dir"
          npm init -y >/dev/null 2>&1
          npm install "$package_name@$expected_version" --silent
          actual_version="$(./node_modules/.bin/component-vault --version)"
          test "$actual_version" = "$expected_version"
