version: 1

scan:
  include: [src]
  exclude: [node_modules, .next, .git]
  extensions: [.ts, .tsx, .js, .jsx]

duplicates:
  enabled: true
  minOccurrences: 5
  minTokens: 5

rules:
  forbiddenPatterns:
    - id: arbitrary-text-color
      pattern: 'text-\\[#[0-9a-fA-F]{3,8}\\]'
      message: 'Arbitrary text colors are not allowed.'
      suggestion: 'Use a governed text color token.'
      severity: error

    - id: arbitrary-background-color
      pattern: 'bg-\\[#[0-9a-fA-F]{3,8}\\]'
      message: 'Arbitrary background colors are not allowed.'
      suggestion: 'Use a governed background color token.'
      severity: error

components:
  Text:
    source: src/components/ui/text.tsx
    allowedImportFiles: [src/components/ui/text.tsx]
    forbiddenImports: [tamagui, "@radix-ui/themes"]
    forbiddenProps: [fontSize, lineHeight, fontWeight]
    strategy: touched
    rawElements:
      h1: H1
      h2: H2
      p: Paragraph
      small: Caption
    documentation:
      H1: Use for the main page title. Keep visual hierarchy consistent with the Text component.
      H2: Use for section headings inside pages and panels.
      Paragraph: Use for readable body copy and explanatory content.
      Caption: Use for metadata, labels and supporting copy.
